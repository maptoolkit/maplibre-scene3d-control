<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>maplibre-scene3d-control demo</title>
    <style>
      body {
        margin: 0;
      }
      #map {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="module">
      import { Map, config } from "maplibre-gl";
      import "maplibre-gl/dist/maplibre-gl.css";
      import "../src/style.css";
      import { Scene3dControl } from "../src/index.ts";

      // See maplibre-style-control's demo: in the production build maplibre-gl needs its worker URL.
      if (import.meta.env.PROD) {
        config.WORKER_URL = new URL("./maplibre-gl-worker.mjs", import.meta.url).href;
      }

      const map = new Map({
        container: "map",
        style: "https://styles.maptoolkit.org/summer.json",
        center: [16.359, 48.21], // Vienna, Rathauspark
        zoom: 16.4,
        pitch: 70,
        bearing: -28.5,
        maxPitch: 85,
        canvasContextAttributes: { antialias: true },
        hash: true,
      });

      // The published styles don't carry metadata["maptoolkit:scene3d"] yet, so the demo passes the scene
      // (generated by style-family-js) itself. Once they do, `scene` can go: the control reads the style's.
      const control = new Scene3dControl({ apiKey: "iib", button: true, scene: "./scene.json" });
      control.on("scene.change", (ev) => console.log("scene.change", ev.scene));
      map.addControl(control);
    </script>
  </body>
</html>
